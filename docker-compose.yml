version: '3'

services:
  nginx:
    image: nginx:latest
    container_name: nginx
    networks:
      - nginx-docker
      - yearnwebsite_default
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /root/nginx-docker/html:/usr/share/nginx/html
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

networks:
  nginx-docker:
    external: true
  yearnwebsite_default:
    external: true
