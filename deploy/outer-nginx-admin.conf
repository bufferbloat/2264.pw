# Add this server to the host/outer Nginx after the wildcard certificate is issued.
# Replace 2264-web with the reachable Docker-network upstream name if the outer proxy
# itself is not attached to nginx-docker.
server {
    listen 80;
    listen [::]:80;
    server_name admin.2264.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.2264.eu;

    ssl_certificate /etc/letsencrypt/live/2264.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/2264.eu/privkey.pem;

    client_max_body_size 26m;
    location / {
        proxy_pass http://2264-web:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_body_timeout 300s;
        proxy_set_header Host admin.2264.eu;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}
