<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.5, maximum-scale=1.0, user-scalable=no">
    <title>files</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            opacity: 0;
            animation: fadeInPage 0.8s ease-out forwards;
            overflow-y: auto;
            overflow-x: hidden;
        }

        @keyframes fadeInPage {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            background-color: #fff;
            width: 1px;
            height: 1px;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .top-buttons {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 1;
        }

        .top-button {
            color: #fff;
            font-family: monospace;
            font-size: 16px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .top-button:hover {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
        }

        .main-container {
            position: relative;
            width: 1400px;
            margin-top: 90px;
            margin-bottom: 40px;
            border: 1px solid #333333;
            background-color: #000000b3;
            padding: 40px;
            box-sizing: border-box;
        }

        .copyright {
            position: relative;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        iframe {
            width: 100%;
            height: 500px;
            border: none;
            background: #00000000;
        }
    </style>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="stars"></div>
    <div class="top-buttons">
        <a href="https://2264.pw" class="top-button">home</a>
        <a href="https://2264.pw/posts" class="top-button">posts</a>
        <a href="https://2264.pw/files" class="top-button">files</a>
    </div>

    <div class="main-container">
        <iframe src="src/" frameborder="0"></iframe>
    </div>

    <div class="copyright">© 2264.pw</div>

    <script>
        function createStars() {
            const stars = document.querySelector('.stars');
            const count = 200;

            stars.innerHTML = '';
            for (let i = 0; i < count; i++) {
                createStar(stars);
            }
        }

        window.addEventListener('resize', createStars);

        function createStar(container) {
            const element = document.createElement('div');
            element.classList.add('star');
            resetElement(element);
            container.appendChild(element);
            animateStar(element);
        }

        function resetElement(element) {
            element.style.left = `${Math.random() * 100}%`;
            element.style.top = `${Math.random() * 100}%`;
        }

        function animateStar(star) {
            star.animate([
                { transform: 'translate(0, 0)' },
                { transform: `translate(${Math.random() * 200 - 100}px, ${Math.random() * 200 - 100}px)` }
            ], {
                duration: Math.random() * 3000 + 3000,
                iterations: Infinity,
                direction: 'alternate',
                easing: 'ease-in-out'
            });

            star.animate([
                { opacity: Math.random() * 0.5 + 0.1 },
                { opacity: Math.random() * 0.3 + 0.7 },
                { opacity: Math.random() * 0.5 + 0.1 }
            ], {
                duration: Math.random() * 3000 + 2000,
                iterations: Infinity,
                direction: 'alternate',
                easing: 'ease-in-out'
            });
        }

        createStars();
    </script>
</body>
</html>
