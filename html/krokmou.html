<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Krokmou</title>
    <link rel="stylesheet" href="css/base.css?v=20260612e">
    <link rel="stylesheet" href="css/krokmou.css?v=20260612b">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="js/site.js" defer></script>
</head>
<body class="krokmou-page">
    <div class="stars"></div>

    <main class="krokmou-main page-layer">
        <h1 class="title">For my little buddy <span class="krokmou-name">Krokmou</span></h1>

        <div class="krokmou-image">
            <img src="assets/img/krok.png?v=1" alt="Krokmou sitting outdoors" width="1000" height="706">
        </div>

        <div class="counter-group" aria-live="polite">
            <div class="counter-section">
                <div id="lifespan">Calculating...</div>
                <div id="lifespan-days" class="days"></div>
            </div>

            <div class="counter-section">
                <div id="would-be">Calculating...</div>
                <div id="would-be-days" class="days"></div>
            </div>

            <div class="counter-section">
                <div id="passed">Calculating...</div>
                <div id="passed-days" class="days"></div>
            </div>
        </div>

        <div class="text-area">
            <div class="text-content"></div>
        </div>

        <div class="krokmou-gallery">
            <figure class="krokmou-photo">
                <img src="assets/img/krokmou/IMG_0024.JPG" alt="Krokmou in the snow" loading="lazy" width="900" height="1200">
                <figcaption class="krokmou-caption">&gt; snow</figcaption>
            </figure>
            <figure class="krokmou-photo">
                <img src="assets/img/krokmou/IMG_0320.JPG" alt="Krokmou near pizza" loading="lazy" width="900" height="1200">
                <figcaption class="krokmou-caption">&gt; *drool* pizza</figcaption>
            </figure>
            <figure class="krokmou-photo">
                <img src="assets/img/krokmou/IMG_0427.JPG" alt="Krokmou napping" loading="lazy" width="900" height="1200">
                <figcaption class="krokmou-caption">&gt; nappies</figcaption>
            </figure>
            <figure class="krokmou-photo">
                <img src="assets/img/krokmou/IMG_1485.JPG" alt="Krokmou eating with Yoda" loading="lazy" width="900" height="1200">
                <figcaption class="krokmou-caption">&gt; lunch time with yoda</figcaption>
            </figure>
            <figure class="krokmou-photo">
                <img src="assets/img/krokmou/IMG_1867.JPG" alt="Krokmou staring at the camera" loading="lazy" width="900" height="1200">
                <figcaption class="krokmou-caption">&gt; stare</figcaption>
            </figure>
            <figure class="krokmou-photo">
                <img src="assets/img/krokmou/IMG_2086.JPG" alt="Krokmou blepping" loading="lazy" width="900" height="1200">
                <figcaption class="krokmou-caption">&gt; blep</figcaption>
            </figure>
            <figure class="krokmou-photo">
                <img src="assets/img/krokmou/IMG_2468.JPG" alt="Krokmou looking cute" loading="lazy" width="1200" height="900">
                <figcaption class="krokmou-caption">&gt; :3</figcaption>
            </figure>
            <figure class="krokmou-photo">
                <img src="assets/img/krokmou/IMG_2619.JPG" alt="Krokmou blepping again" loading="lazy" width="900" height="1200">
                <figcaption class="krokmou-caption">&gt; blep 2</figcaption>
            </figure>
            <figure class="krokmou-photo">
                <img src="assets/img/krokmou/IMG_2816.JPG" alt="Krokmou looking tired" loading="lazy" width="900" height="1200">
                <figcaption class="krokmou-caption">&gt; tired</figcaption>
            </figure>
            <figure class="krokmou-photo">
                <img src="assets/img/krokmou/IMG_2847.JPG" alt="Krokmou asking for food" loading="lazy" width="900" height="1200">
                <figcaption class="krokmou-caption">&gt; give food now</figcaption>
            </figure>
            <figure class="krokmou-photo">
                <img src="assets/img/krokmou/IMG_2984.JPG" alt="Krokmou resting in a weird position" loading="lazy" width="900" height="1200">
                <figcaption class="krokmou-caption">&gt; weird position</figcaption>
            </figure>
            <figure class="krokmou-photo">
                <img src="assets/img/krokmou/IMG_3126.JPG" alt="Krokmou looking unbothered" loading="lazy" width="900" height="1200">
                <figcaption class="krokmou-caption">&gt; unbothered</figcaption>
            </figure>
            <figure class="krokmou-photo">
                <img src="assets/img/krokmou/IMG_3267.JPG" alt="Krokmou resting in another weird position" loading="lazy" width="900" height="1200">
                <figcaption class="krokmou-caption">&gt; weird position 2</figcaption>
            </figure>
            <figure class="krokmou-photo">
                <img src="assets/img/krokmou/IMG_3318.JPG" alt="Krokmou chilling" loading="lazy" width="900" height="1200">
                <figcaption class="krokmou-caption">&gt; chilling</figcaption>
            </figure>
            <figure class="krokmou-photo">
                <img src="assets/img/krokmou/IMG_8589.JPG" alt="Krokmou with wide eyes" loading="lazy" width="675" height="1200">
                <figcaption class="krokmou-caption">&gt; O_O</figcaption>
            </figure>
        </div>
    </main>

    <script src="js/krokmou.js"></script>
    <script src="js/oneko0458.js"></script>
</body>
</html>
