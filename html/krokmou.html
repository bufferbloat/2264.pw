        <script>
            function getParisTime() {
                return new Date(
                    new Date().toLocaleString("en-US", {
                        timeZone: "Europe/Paris",
                    }),
                );
            }

            function calculateTimeDifference(startDate, endDate) {
                const start = new Date(startDate);
                start.setHours(0, 0, 0, 0);

                const end = new Date(endDate);
                end.setHours(0, 0, 0, 0);

                const totalDays = Math.floor(
                    (end - start) / (24 * 60 * 60 * 1000),
                );

                // Calculate years properly using date arithmetic
                let years = end.getFullYear() - start.getFullYear();
                let tempDate = new Date(start);
                tempDate.setFullYear(tempDate.getFullYear() + years);
                if (tempDate > end) {
                    years--;
                    tempDate.setFullYear(tempDate.getFullYear() - 1);
                }

                // Calculate months after years
                let months = end.getMonth() - tempDate.getMonth();
                if (end.getDate() < tempDate.getDate()) {
                    months--;
                }
                if (months < 0) {
                    months += 12;
                }

                // Calculate remaining days after years and months
                let tempDate2 = new Date(tempDate);
                tempDate2.setMonth(tempDate2.getMonth() + months);
                if (tempDate2 > end) {
                    months--;
                    tempDate2.setMonth(tempDate2.getMonth() - 1);
                }

                let remainingDays = Math.floor(
                    (end - tempDate2) / (24 * 60 * 60 * 1000),
                );

                // If less than a full month remaining, use weeks and days
                const weeks = Math.floor(remainingDays / 7);
                const days = remainingDays % 7;

                const isWouldBeAgeCalculation =
                    startDate.toString() === new Date("2023-07-25").toString();

                return {
                    years,
                    months,
                    weeks,
                    days,
                    totalDays: isWouldBeAgeCalculation
                        ? totalDays + 1
                        : totalDays,
                };
            }

            function formatDuration(duration) {
                let parts = [];

                if (duration.years > 0) {
                    parts.push(
                        `${duration.years} year${duration.years > 1 ? "s" : ""}`,
                    );
                }

                // Use months if we have any, otherwise use weeks for small remainders
                if (duration.months > 0) {
                    parts.push(
                        `${duration.months} month${duration.months > 1 ? "s" : ""}`,
                    );
                    // After months, show remaining days (weeks don't make sense here)
                    const remainingDays = duration.weeks * 7 + duration.days;
                    if (remainingDays > 0) {
                        parts.push(
                            `${remainingDays} day${remainingDays > 1 ? "s" : ""}`,
                        );
                    }
                } else {
                    // No months, so use weeks and days
                    if (duration.weeks > 0) {
                        parts.push(
                            `${duration.weeks} week${duration.weeks > 1 ? "s" : ""}`,
                        );
                    }
                    if (duration.days > 0) {
                        parts.push(
                            `${duration.days} day${duration.days > 1 ? "s" : ""}`,
                        );
                    }
                }

                if (parts.length === 0) {
                    return "0 days";
                } else if (parts.length === 1) {
                    return parts[0];
                } else {
                    // Join all but last with ", " then add " and " before last
                    return (
                        parts.slice(0, -1).join(", ") +
                        " and " +
                        parts[parts.length - 1]
                    );
                }
            }

            function formatTimeSincePassing(duration) {
                // Use the same formatting as formatDuration since we now calculate properly
                return formatDuration(duration);
            }

            function updateCounters() {
                const now = getParisTime();
                const birthDate = new Date("2023-07-25");
                const passedDate = new Date("2025-08-03");

                // 1st text static
                document.getElementById("lifespan").innerHTML =
                    '<span class="krokmou-name">Krokmou</span> lived to be 2 years, 1 week, 3 days old.';
                document.getElementById("lifespan-days").textContent =
                    "(741 days)";

                // 2nd text
                const wouldBeAge = calculateTimeDifference(birthDate, now);
                document.getElementById("would-be").innerHTML =
                    `<span class="krokmou-name">Krokmou</span> would be ${formatDuration(wouldBeAge)} old today.`;
                document.getElementById("would-be-days").textContent =
                    `(${wouldBeAge.totalDays} days)`;

                // 3rd text
                const timeSincePassing = calculateTimeDifference(
                    passedDate,
                    now,
                );
                document.getElementById("passed").innerHTML =
                    `<span class="krokmou-name">Krokmou</span> passed away ${formatTimeSincePassing(timeSincePassing)} ago.`;
                document.getElementById("passed-days").textContent =
                    `(${timeSincePassing.totalDays} day${timeSincePassing.totalDays === 1 ? "" : "s"} ago)`;
            }

            updateCounters();
            setInterval(updateCounters, 1000);

            // stars
            function createStars() {
                const stars = document.querySelector(".stars");
                const count = 200;

                stars.innerHTML = "";
                for (let i = 0; i < count; i++) {
                    createStar(stars);
                }
            }

            window.addEventListener("resize", createStars);

            function createStar(container) {
                const element = document.createElement("div");
                element.classList.add("star");
                resetElement(element);
                container.appendChild(element);
                animateStar(element);
            }

            function resetElement(element) {
                element.style.left = `${Math.random() * 100}%`;
                element.style.top = `${Math.random() * 100}%`;
            }

            function animateStar(star) {
                star.animate(
                    [
                        { transform: "translate(0, 0)" },
                        {
                            transform: `translate(${Math.random() * 200 - 100}px, ${Math.random() * 200 - 100}px)`,
                        },
                    ],
                    {
                        duration: Math.random() * 3000 + 3000,
                        iterations: Infinity,
                        direction: "alternate",
                        easing: "ease-in-out",
                    },
                );

                star.animate(
                    [
                        { opacity: Math.random() * 0.5 + 0.1 },
                        { opacity: Math.random() * 0.3 + 0.7 },
                        { opacity: Math.random() * 0.5 + 0.1 },
                    ],
                    {
                        duration: Math.random() * 3000 + 2000,
                        iterations: Infinity,
                        direction: "alternate",
                        easing: "ease-in-out",
                    },
                );
            }

            // initialize stars
            createStars();
        </script>
