<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>teamspeak</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            opacity: 0;
            animation: fadeInPage 0.8s ease-out forwards;
        }

        @keyframes fadeInPage {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            background-color: #fff;
            width: 1px;
            height: 1px;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }


        .top-buttons {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 1;
        }

        .top-button {
            background-color: transparent;
            border: 1px solid #fff;
            color: #fff;
            padding: 3px 10px;
            font-family: monospace;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            text-decoration: none;
        }

        .top-button:hover {
            background-color: #fff;
            color: #000;
            text-decoration: none;
        }

        .center-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .center-link {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .center-link:hover {
            text-decoration: underline;
        }

        .ts3index-viewer {
            width: 150%;
            height: 300px;
            border: 1px solid #333;
            max-width: 100%;
            overflow: hidden;
        }

        .copyright {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }
    </style>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="stars"></div>
    <div class="top-buttons">
        <a href="https://2264.pw" class="top-button">home</a>
        <a href="https://2264.pw/posts" class="top-button">posts</a>
        <a href="https://2264.pw/files" class="top-button">files</a>
    </div>

    <div class="center-content">
        <a href="ts3server://ts.2264.pw?port=9987" class="center-link">ts.2264.pw</a>
        <div class="ts3index-viewer" data-serverid="303396" data-style="width=150%25&height=300px&bgcolor=000000&font=Arial&size=12&color=FFFFFF&serverc=B8B8B8&spacerc=B8B8B8&channelc=FFFFFF&clientc=FFFFFF&hidecountry"></div>
    </div>

    <div class="copyright">© 2264.pw</div>

    <script>
        function createStars() {
            const stars = document.querySelector('.stars');
            const count = 200;

            stars.innerHTML = '';
            for (let i = 0; i < count; i++) {
                createStar(stars);
            }
        }

        function createStar(container) {
            const element = document.createElement('div');
            element.classList.add('star');
            resetElement(element);
            container.appendChild(element);
            animateStar(element);
        }

        function resetElement(element) {
            element.style.left = `${Math.random() * 100}%`;
            element.style.top = `${Math.random() * 100}%`;
        }

        function animateStar(star) {
            // Movement animation
            star.animate([
                { transform: 'translate(0, 0)' },
                { transform: `translate(${Math.random() * 200 - 100}px, ${Math.random() * 200 - 100}px)` }
            ], {
                duration: Math.random() * 3000 + 3000,
                iterations: Infinity,
                direction: 'alternate',
                easing: 'ease-in-out'
            });

            // Opacity animation
            star.animate([
                { opacity: Math.random() * 0.5 + 0.1 },
                { opacity: Math.random() * 0.3 + 0.7 },
                { opacity: Math.random() * 0.5 + 0.1 }
            ], {
                duration: Math.random() * 3000 + 2000,
                iterations: Infinity,
                direction: 'alternate',
                easing: 'ease-in-out'
            });
        }


        function checkElementPositions() {
            const elements = document.querySelectorAll('.star');
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            elements.forEach(element => {
                const rect = element.getBoundingClientRect();
                if (rect.bottom < 0 || rect.top > viewportHeight || rect.right < 0 || rect.left > viewportWidth) {
                    resetElement(element);
                    animateStar(element);
                }
            });

            requestAnimationFrame(checkElementPositions);
        }

        createStars();
        checkElementPositions();

        // TeamSpeak 
        (function() {
            var c = document.createElement("script"),
                s = document.getElementsByTagName("script")[0];
            c.type = "text/javascript";
            c.async = true;
            c.src = "https://ts3index.com/viewer/script.js";
            s.parentNode.insertBefore(c, s);
        })();
    </script>
</body>
