<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/base.css?v=20260504b">

    <main class="links-page page-layer">
        <div class="links-side-column">
            <section class="links-container directory-container" aria-labelledby="directory-title">

                <div class="people-buttons" aria-label="Cool people's buttons">

                    <a href="https://vulpecula.neocities.org/" target="_blank" rel="noopener noreferrer"><img src="https://vulpecula.neocities.org/images/vulpbutton3.gif" alt="vulpecula.neocities.org"></a>

                    <a href="https://malune.net/" target="_blank" rel="noopener noreferrer"><img src="https://malune.net/assets/resources/buttons/malune-2.gif" alt="malune.net"></a>

            <img src="assets/img/logo.png" alt="" width="150" height="50">
        </button>
    </footer>

</html>
