server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri.html $uri $uri/ =404;
    }

    location /src/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_before_body /autoindex/header.html;
        add_after_body /autoindex/footer.html;
    }
}
