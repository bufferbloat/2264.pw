map $http_x_forwarded_proto $origin_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name admin.2264.eu;
    client_max_body_size 26m;

    location / {
        proxy_pass http://admin-web:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_body_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}

server {
    listen 8080 default_server;
    server_name 2264.eu www.2264.eu _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    absolute_redirect off;

    if ($request_uri ~ ^(/blog/[A-Za-z0-9_-]+)\.html(?:\?.*)?$) { return 301 $1$is_args$args; }

    location = /blog {
        ssi on;
        default_type text/html;
        alias /srv/generated/current/blog.html;
    }

    location ~ ^/blog/([A-Za-z0-9_-]+)$ {
        ssi on;
        default_type text/html;
        set $blog_slug $1;
        alias /srv/generated/current/blog/$blog_slug.html;
        error_page 404 = @blog_redirect;
    }

    location @blog_redirect {
        proxy_pass http://blog-stats:8080/redirects/$blog_slug;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
    }

    location = /links/resources {
        ssi on;
        default_type text/html;
        alias /srv/generated/current/links/resources.html;
    }

    location = /sitemap.xml {
        alias /srv/generated/current/sitemap.xml;
    }

    location = /sitemap.html {
        return 301 /sitemap$is_args$args;
    }

    location = /sitemap {
        ssi on;
        default_type text/html;
        alias /srv/generated/current/sitemap.html;
    }

    location / {
        ssi on;
        try_files $uri.html $uri $uri/ =404;
    }

    location = /api/playing {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $playing_api http://yoda-presence-api:3000;
        proxy_pass $playing_api/playing;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
    }

    location /api/blog/ {
        client_max_body_size 1k;
        proxy_pass http://blog-stats:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
    }

    location /components/ { internal; }

    location /media/posts/ {
        alias /srv/media/public/;
        add_header X-Content-Type-Options nosniff always;
    }

    location /src/ {
        alias /srv/managed/public/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        autoindex_format html;

        if ($request_filename ~ \.(txt|pdf|zip|rar|7z|tar|gz|bat|exe|iso)$) { add_header Content-Disposition "attachment"; }

        add_before_body /autoindex/header.html;
        add_after_body /autoindex/footer.html;
        default_type text/html;
        charset utf-8;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
    }
}
